name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android WebView APK
        run: |
          # ── Create project structure ──────────────────────────────
          mkdir -p app/src/main/java/com/runehatch
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper

          # ── Copy game HTML ────────────────────────────────────────
          cp index.html app/src/main/assets/index.html

          # ── Gradle wrapper ────────────────────────────────────────
          curl -sL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties

          # ── settings.gradle ───────────────────────────────────────
          cat > settings.gradle << 'GRADLE'
          rootProject.name = 'runehatch'
          include ':app'
          GRADLE

          # ── build.gradle (root) ───────────────────────────────────
          cat > build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          GRADLE

          # ── app/build.gradle ──────────────────────────────────────
          cat > app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.runehatch'
              defaultConfig {
                  applicationId 'com.runehatch.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildFeatures { buildConfig true }
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE

          # ── gradle.properties ─────────────────────────────────────
          cat > gradle.properties << 'GRADLE'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          GRADLE

          # ── AndroidManifest.xml ───────────────────────────────────
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:name=".MainApplication"
                  android:label="Runehatch"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          # ── MainActivity.java ─────────────────────────────────────
          cat > app/src/main/java/com/runehatch/MainActivity.java << 'JAVA'
          package com.runehatch;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.view.WindowManager;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          JAVA

          # ── MainApplication.java ──────────────────────────────────
          cat > app/src/main/java/com/runehatch/MainApplication.java << 'JAVA'
          package com.runehatch;
          import android.app.Application;
          public class MainApplication extends Application {}
          JAVA

          # ── strings.xml ───────────────────────────────────────────
          cat > app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Runehatch</string></resources>
          XML

          # ── styles.xml ────────────────────────────────────────────
          cat > app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0a0710</item>
              </style>
          </resources>
          XML

          # ── App icon ──────────────────────────────────────────────
          sudo apt-get install -y imagemagick -q
          convert -size 1024x1024 xc:'#0a0710' \
            -fill '#9b5de5' -draw 'circle 512,512 512,120' \
            -fill '#6a0dad' -draw 'circle 512,512 512,280' \
            -fill '#f0d97a' -pointsize 420 -gravity center \
            -font DejaVu-Sans-Bold -annotate 0 'R' \
            /tmp/icon.png 2>/dev/null || convert -size 1024x1024 xc:'#1a0a2e' /tmp/icon.png
          for r in "48:mdpi" "72:hdpi" "96:xhdpi" "144:xxhdpi" "192:xxxhdpi"; do
            s="${r%%:*}"; d="${r##*:}"
            convert /tmp/icon.png -resize ${s}x${s} app/src/main/res/mipmap-${d}/ic_launcher.png
            cp app/src/main/res/mipmap-${d}/ic_launcher.png app/src/main/res/mipmap-${d}/ic_launcher_round.png
          done

          # ── Keystore ──────────────────────────────────────────────
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          # ── Build ─────────────────────────────────────────────────
          ./gradlew assembleRelease --no-daemon --max-workers 2
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runehatch-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
